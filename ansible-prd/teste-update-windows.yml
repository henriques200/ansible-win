---
- name: Windows update playbook
  hosts: bupi_prd
  gather_facts: false
  tasks:
    - name: Check for available updates
      ansible.windows.win_updates:
        category_names: '*'
        state: searched
        server_selection: windows_update
    - name: Apply pending updates
      ansible.windows.win_updates:
        category_names: '*'
        state: installed
        server_selection: windows_update
        reboot: true
      register: update_result
      retries: 1
      delay: 60
      until: update_result is succeeded
      ignore_errors: yes
    - name: Summary (installed count + reboot required flag)
      ansible.builtin.debug:
        msg: |
          Host: {{ inventory_hostname }}
          Updates found: {{ update_result.found_update_count | default(0) }}
          Updates installed: {{ update_result.installed_update_count | default(0) }}
          Reboot required? {{ update_result.reboot_required | default(false) }}
